version: '3.8'

services:
  rewards:
    build:
      context: ../../
      target: build
      dockerfile: services/economics-rewards/Dockerfile
    command: yarn workspace @ebla-network/economics-rewards start:prod
    volumes:
      - ./data/economics:/app/data
      - /app/node_modules
    environment:
      PROVIDER: ws://127.0.0.1:8777
      DB_DATABASE: /app/data/economics.sql
      DPOS_CONTRACT_ADDRESS: "0x00000000000000000000000000000000000000fe"
    depends_on:
      ebla-node:
        condition: service_healthy
    restart: always
    network_mode: host
  ebla-node:
    # TODO(EBLA): this entire service definition uses Taraxa CLI shape and data layout.
    # ebla-node verification (May 2026, ebla-stable @ a83f38efd) confirms:
    #   - Binary is named "eblad" (not "taraxad")
    #   - Default config path: /root/.ebla/conf_ebla.json (via EBLA_CONF_PATH)
    #   - Default persistent path: /root/.ebla (via EBLA_PERSISTENT_PATH)
    #   - CLI flags differ: uses --config and --chain-id; --chain/--wallet/--data-dir status unverified
    # Before deploy:
    #   1. Pin a real image tag instead of :latest
    #   2. Rewrite the command line using eblad's actual flag set
    #      (run `eblad --help` or read ebla-node/programs/eblad/main.cpp)
    #   3. Update volume mount path /opt/taraxa_data/data to /root/.ebla
    #      or set EBLA_PERSISTENT_PATH to the desired location
    image: ghcr.io/ebla-network/ebla-node:latest
    restart: always
    entrypoint: /usr/bin/sh
    command: >
      -c "mkdir -p /opt/taraxa_data/data &&
          taraxad --chain mainnet --wallet /opt/taraxa_data/conf/wallet.json --config /opt/taraxa_data/conf/mainnet.json --data-dir /opt/taraxa_data/data --overwrite-config --enable-test-rpc"
    ports:
      - 7777:7777
      - 8777:8777
    volumes:
      - ./data/node:/opt/taraxa_data/data
    network_mode: host
    healthcheck:
      test: curl --silent --show-error http://127.0.0.1:8777 || exit 1
      interval: 10s
      retries: 5
      start_period: 20s
      timeout: 10s
